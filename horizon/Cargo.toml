[package]
name = "horizon-mod-take-your-stream-chat"
version = "0.2.0"
edition = "2024"
license = "CC0-1.0"
publish = false
description = "Take Your Stream Chat for Horizon, a native mod: live Twitch and TikTok chat on the HUD and floating in the world."

# The mod's logic and its tests: the same file the bundle adds to the game. It is only ever built as its test
# target here (`cargo test`): in the game it sits next to tiktok_net.rs, which a plain library build can't reach.
[lib]
path = "mixins/take_your_stream_chat/runtime.rs"
doctest = false
bench = false
